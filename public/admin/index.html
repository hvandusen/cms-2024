  <title>Henry VD CMS</title>

<body>
  <!-- Publishing is Sveltia's built-in "Publish Changes" button. It needs the
       Netlify build hook URL, which lives in per-browser prefs rather than this
       file or config.yml: Settings > Advanced > Deploy Hook > Hook URL.
         https://api.netlify.com/build_hooks/5f636e14a0ebcb0e74013871
       Set it once per browser you edit from. Replaces a hand-rolled anchor that
       was absolutely positioned against netlify-cms 2.x's header and fired the
       hook with no success/failure feedback. -->
  <!-- Sveltia CMS. Version pinned deliberately: this file previously floated on
       netlify-cms@^2.0.0 from a CDN, which is how we ended up silently running
       an abandoned 2.x bundle. Bump this by hand. -->
  <script src="https://unpkg.com/@sveltia/cms@0.172.4/dist/sveltia-cms.js"></script>
</body>
